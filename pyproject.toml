[project]
name = "events-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Caue Finger", email = "fingercaue@gmail.com" },
    { name = "Vinicius Finger", email = "fingervinicius@icloud.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
events-api = "events_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
